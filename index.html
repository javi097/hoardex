<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />

    <title>Hoardex — Cataloga tus aficiones y gamifica tu colección</title>
    <meta
      name="description"
      content="Aplicación web para catalogar y coleccionar tus aficiones (videojuegos, libros, juegos de mesa, figuras, cómics y más) con gamificación, XP, niveles, rachas, retos y sincronización."
    />

    <!-- Metadatos Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hoardex — Cataloga tus aficiones y gamifica tu colección" />
    <meta
      property="og:description"
      content="Aplicación web para catalogar y coleccionar tus aficiones con gamificación, XP, niveles, rachas, retos y sincronización."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:url" content="https://hoardex.app" />

    <!-- Metadatos Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hoardex — Cataloga tus aficiones y gamifica tu colección" />
    <meta
      name="twitter:description"
      content="Aplicación web para catalogar y coleccionar tus aficiones con gamificación, XP, niveles, rachas, retos y sincronización."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Anti-FOUC: aplica .dark antes de que React hidrate -->
    <script>
      (function () {
        var theme = localStorage.getItem('hoardex-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
